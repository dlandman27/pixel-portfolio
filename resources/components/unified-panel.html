<div
  id="unified-panel"
  class="unified-panel"
  role="dialog"
  aria-modal="true"
  aria-labelledby="unified-panel-title"
  aria-hidden="true"
>
  <div class="unified-panel-overlay"></div>

  <div class="unified-panel-container">
    <header class="unified-panel-header">
      <button type="button" class="unified-panel-back" aria-label="Back to menu">
        <span aria-hidden="true">◂</span> Menu
      </button>
      <h2 class="unified-panel-title" id="unified-panel-title"></h2>
      <button type="button" class="unified-panel-close" aria-label="Close">
        <span aria-hidden="true">✕</span>
      </button>
    </header>
    <div
      class="unified-panel-content"
      id="unified-panel-tabpanel"
      role="region"
      aria-labelledby="unified-panel-title"
    ></div>
  </div>
</div>
