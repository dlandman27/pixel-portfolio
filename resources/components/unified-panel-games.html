<div class="tab-content-wrapper games-content">
  <div class="tab-header-with-subtitle">
    <h2 class="tab-content-title">Games</h2>
    <p class="tab-subtitle">
      Quick arcade moments hidden around the park. Launch them from here
      whenever you&rsquo;re in the mood.
    </p>
  </div>

  <div class="games-layout">
    <section class="game-detail" data-role="game-detail">
      <div class="game-detail-content">
        <h3 class="game-detail-title" data-role="game-detail-title">
          Select a Game
        </h3>
        <div class="game-detail-location" data-role="game-detail-location"></div>
        <p class="game-detail-description" data-role="game-detail-description">
          Choose a game from below to see details, rules, and your high scores.
        </p>
        <div class="game-detail-rules" data-role="game-detail-rules"></div>
        <div class="game-detail-score" data-role="game-detail-score"></div>
        <div class="game-detail-actions" data-role="game-detail-actions">
          <button class="nes-btn is-primary" data-role="game-action" style="display: none;">
            Play Now
          </button>
        </div>
      </div>
    </section>

    <section class="games-grid-wrapper">
      <div class="games-grid" data-role="games-grid">
        <div
          class="game-card"
          data-game-key="fishing"
          data-game-title="Fishing Frenzy"
          data-game-location="📍 At the Dock"
          data-game-description="Cast your line off the dock and wait for a bite, then reel it in before time runs out. Every catch goes into your Fishbook, and there are 10 different fish to find."
          data-game-rules="Grab the fishing rod on the dock, click the Fishing Frenzy sign, then press Throw Line. When a fish bites, tap SPACE as fast as you can to reel it in before the timer runs out. Bigger fish take more pulls."
        >
          <div class="game-card-icon">🎣</div>
          <div class="game-card-name">Fishing Frenzy</div>
        </div>

        <div
          class="game-card"
          data-game-key="soccer"
          data-game-title="Soccer Shootout"
          data-game-location="📍 At the Soccer Field"
          data-game-description="Test your timing on the soccer field. Score as many goals as you can in 30 seconds."
          data-game-rules="The ball slides left and right on its own. Press ENTER to shoot when it lines up with the goal. Every goal is a point, and your best score is saved."
        >
          <div class="game-card-icon">⚽</div>
          <div class="game-card-name">Soccer Shootout</div>
        </div>
      </div>
    </section>
  </div>
</div>
